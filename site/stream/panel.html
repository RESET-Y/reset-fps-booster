<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RFB Twitch Panel</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<!--
  RESET FPS BOOSTER - TWITCH PANEL, drawn at 640 x 320 (Twitch shows panels
  320 wide, so this is twice that and stays sharp). Rendered to a PNG with a
  headless browser screenshot; ?code=RICK20&discount=20 makes a streamer's own
  version, ?lang=en the English one.
-->
<style>
:root {
  --accent: #e8121f; --accent-bright: #ff3242; --glow: rgba(232,18,31,.45);
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --skew: -12deg;
}
html, body { margin: 0; width: 640px; height: 320px; overflow: hidden; background: #050505; }
.panel { position: relative; width: 640px; height: 320px; overflow: hidden;
  background: radial-gradient(ellipse at 78% 110%, rgba(232,18,31,.28), transparent 60%), #050505; }
.stripe { position: absolute; left: 0; right: 0; height: 14px;
  background: repeating-linear-gradient(-56deg, var(--accent) 0 12px, #000 12px 24px); }
.stripe.top { top: 0; } .stripe.bottom { bottom: 0; }
/* the grid floor of the share card */
.floor { position: absolute; left: -10%; right: -10%; bottom: 14px; height: 170px;
  background:
    linear-gradient(rgba(232,18,31,.30) 1px, transparent 1px) 0 0 / 100% 20px,
    linear-gradient(90deg, rgba(232,18,31,.24) 1px, transparent 1px) 0 0 / 40px 100%;
  transform: perspective(240px) rotateX(60deg); transform-origin: bottom;
  -webkit-mask-image: linear-gradient(transparent, #000 70%); mask-image: linear-gradient(transparent, #000 70%); }
.logo { position: absolute; left: 34px; top: 40px; width: 150px; }
.logo img { width: 100%; display: block; }
.head { position: absolute; left: 208px; top: 44px; right: 30px; }
.eyebrow { font: 500 15px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: #a8a8a8; }
.name { margin-top: 6px; font: italic 900 50px/0.9 var(--display); text-transform: uppercase; color: #fff; white-space: nowrap; }
.name .red { color: var(--accent-bright); text-shadow: 0 0 22px var(--glow); }
.feat { position: absolute; left: 34px; right: 34px; top: 148px; font: 600 19px/1.3 "Barlow", "Segoe UI", sans-serif; color: #d6d6d6; }
.feat b { color: #fff; }
.feat .dot { color: var(--accent-bright); padding: 0 6px; }
.cta { position: absolute; left: 34px; right: 34px; bottom: 44px; display: flex; gap: 14px; align-items: center; }
.tag { display: inline-block; padding: 8px 18px 6px; background: var(--accent); transform: skewX(var(--skew)); box-shadow: 0 0 24px var(--glow); }
.tag > span { display: inline-block; transform: skewX(12deg); font: italic 800 26px/1 var(--display); color: #fff; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.cta.tight .tag > span { font-size: 23px; }
.tag.ghost { background: transparent; box-shadow: none; border: 2px solid rgba(255,255,255,.85); padding: 6px 16px 4px; }
</style>
</head>
<body>
<div class="panel">
  <div class="stripe top"></div>
  <div class="floor"></div>
  <div class="logo"><img src="../assets/logo_wide.png" alt="RFB"></div>
  <div class="head">
    <div class="eyebrow" id="eyebrow">Ich spiele mit</div>
    <div class="name">Reset <span class="red">FPS Booster</span></div>
  </div>
  <div class="feat" id="feat"></div>
  <div class="cta" id="cta"></div>
  <div class="stripe bottom"></div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const en = (q.get("lang") || "de").toLowerCase() === "en";
  const code = (q.get("code") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 20);
  const discount = parseInt(q.get("discount"), 10);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("eyebrow").textContent = en ? "I play with" : "Ich spiele mit";
  document.getElementById("feat").innerHTML = en
    ? "<b>More FPS</b>, no placebo<span class='dot'>/</span><b>FrameBoost</b><span class='dot'>/</span><b>Smooth Motion</b><span class='dot'>/</span><b>Crosshair</b>"
    : "<b>Mehr FPS</b>, kein Placebo<span class='dot'>/</span><b>FrameBoost</b><span class='dot'>/</span><b>Smooth Motion</b><span class='dot'>/</span><b>Crosshair</b>";
  if (code) document.getElementById("cta").classList.add("tight");
  document.getElementById("cta").innerHTML = code
    ? `<span class="tag"><span>Code ${esc(code)}${isFinite(discount) && discount > 0 ? " · " + discount + (en ? "% off" : " % Rabatt") : ""}</span></span>` +
      `<span class="tag ghost"><span>reset-booster.online</span></span>`
    : `<span class="tag"><span>${en ? "Free download" : "Gratis laden"}</span></span>` +
      `<span class="tag ghost"><span>reset-booster.online</span></span>`;
})();
</script>
</body>
</html>
