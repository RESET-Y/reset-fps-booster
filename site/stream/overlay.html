<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>RFB Stream Overlay</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<!--
  RESET FPS BOOSTER - STREAM OVERLAY for OBS / Streamlabs (Browser Source).

  Add as a Browser Source: width 1920, height 1080, page background is
  transparent. It slides in at a corner, cycles its messages, slides out and
  comes back after a pause. Everything is set in the address:

    ?code=RICK20     the streamer's code; the discount is looked up live
    &lang=en         English (default German)
    &pos=br          corner: bl (default), br, tl, tr
    &show=30         seconds on screen per round (default 30)
    &pause=180       seconds hidden between rounds (default 180; 0 = always on)
    &scale=1.2       size (default 1)
-->
<style>
:root {
  --accent: #e8121f;
  --accent-bright: #ff3242;
  --glow: rgba(232, 18, 31, .45);
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --skew: -12deg;
  --scale: 1;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

#ad {
  position: absolute; width: 780px; height: 150px;
  transform-origin: left bottom; transform: scale(var(--scale));
}
#ad.bl { left: 48px; bottom: 56px; }
#ad.br { right: 48px; bottom: 56px; transform-origin: right bottom; }
#ad.tl { left: 48px; top: 56px; transform-origin: left top; }
#ad.tr { right: 48px; top: 56px; transform-origin: right top; }

/* the slanted plate, built from three layers that arrive one after another */
.plate { position: absolute; inset: 0; transform: skewX(var(--skew)); }
.stripe {
  position: absolute; left: 0; right: 0; top: 0; height: 10px;
  background: repeating-linear-gradient(-56deg, var(--accent) 0 9px, #000 9px 18px);
  background-size: 200% 100%;
  animation: march 1.2s linear infinite;
}
.body {
  position: absolute; left: 0; right: 0; top: 10px; bottom: 0;
  background: linear-gradient(100deg, #0b0b0b 0%, #060606 62%, #1a0306 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset, 0 18px 40px rgba(0,0,0,.55), 0 0 36px var(--glow);
  overflow: hidden;
}
/* the red grid floor of the share card, moving towards the viewer */
.body::before {
  content: ""; position: absolute; inset: -40% -10% 0 30%;
  background:
    linear-gradient(rgba(232,18,31,.28) 1px, transparent 1px) 0 0 / 100% 22px,
    linear-gradient(90deg, rgba(232,18,31,.22) 1px, transparent 1px) 0 0 / 34px 100%;
  transform: perspective(260px) rotateX(58deg);
  transform-origin: bottom;
  mask-image: linear-gradient(90deg, transparent, #000 40%);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
  animation: floor 1.6s linear infinite;
}
/* a light sweep across the plate every few seconds */
.body::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -160px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
  animation: sweep 4.5s ease-in-out infinite;
}
.edge { position: absolute; left: -6px; top: 10px; bottom: 0; width: 6px; background: var(--accent); box-shadow: 0 0 18px var(--glow); }
.timer { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent-bright); }

/* content is un-skewed so text stays upright */
.content { position: absolute; inset: 10px 0 0 0; display: flex; align-items: center; gap: 22px; padding: 0 30px 0 34px; }
.logo { width: 132px; flex: none; }
.logo img { width: 100%; display: block; filter: drop-shadow(0 0 10px rgba(255,255,255,.12)); }
.sep { width: 2px; height: 86px; background: linear-gradient(transparent, rgba(255,255,255,.18), transparent); flex: none; }
.msgs { position: relative; flex: 1; height: 112px; }
.msg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; opacity: 0; }
.msg.in { animation: msgIn .55s cubic-bezier(.2,.9,.25,1) forwards; }
.msg.out { animation: msgOut .35s ease-in forwards; }
.eyebrow {
  font: 500 15px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: #a8a8a8;
  display: flex; align-items: center; gap: 10px;
}
.eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 10px var(--accent-bright); animation: blink 1.1s steps(2) infinite; }
.title {
  margin-top: 8px; font: italic 900 46px/0.95 var(--display); text-transform: uppercase; color: #fff;
  letter-spacing: .01em; white-space: nowrap;
}
.title .red { color: var(--accent-bright); text-shadow: 0 0 22px var(--glow); }
.code {
  display: inline-block; padding: 2px 14px 0; margin-right: 6px; background: var(--accent); color: #fff;
  transform: skewX(var(--skew)); box-shadow: 0 0 20px var(--glow);
}
.code > span { display: inline-block; transform: skewX(12deg); }
.url {
  position: absolute; right: 22px; bottom: -20px; padding: 7px 18px 5px;
  background: var(--accent); transform: skewX(var(--skew));
  box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 22px var(--glow);
}
.url > span { display: inline-block; transform: skewX(12deg); font: italic 800 22px/1 var(--display); color: #fff; letter-spacing: .03em; text-transform: uppercase; }

/* the entrance: plate wipes in, then the content, then the url tag */
#ad { visibility: hidden; }
#ad.show { visibility: visible; }
#ad.show .plate { animation: plateIn .7s cubic-bezier(.2,.9,.2,1) both; }
#ad.show .content { animation: fadeUp .5s .35s both; }
#ad.show .url { animation: tagIn .5s .6s cubic-bezier(.2,.9,.25,1.3) both; }
#ad.hide .plate { animation: plateOut .55s cubic-bezier(.7,0,.8,.3) both; }
#ad.hide .content, #ad.hide .url { animation: fadeOut .3s both; }
#ad.br .plate, #ad.tr .plate { --from: 130%; }

@keyframes march { to { background-position: -36px 0; } }
@keyframes floor { to { background-position: 0 22px, 0 0; } }
@keyframes sweep { 0%, 55% { left: -160px; } 100% { left: 110%; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes plateIn { from { clip-path: inset(0 100% 0 0); transform: skewX(var(--skew)) translateX(-40px); } to { clip-path: inset(0 0 0 0); transform: skewX(var(--skew)); } }
@keyframes plateOut { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); transform: skewX(var(--skew)) translateX(40px); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes tagIn { from { opacity: 0; transform: skewX(var(--skew)) translateY(18px) scale(.9); } to { opacity: 1; transform: skewX(var(--skew)); } }
@keyframes msgIn { from { opacity: 0; transform: translateX(-26px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes msgOut { from { opacity: 1; } to { opacity: 0; transform: translateX(26px); filter: blur(4px); } }
@keyframes tick { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>
<div id="ad" class="bl">
  <div class="edge"></div>
  <div class="plate"><div class="stripe"></div><div class="body"><div class="timer" id="timer"></div></div></div>
  <div class="content">
    <div class="logo"><img src="../assets/logo_wide.png" alt="RFB"></div>
    <div class="sep"></div>
    <div class="msgs" id="msgs"></div>
  </div>
  <div class="url"><span id="url">reset-booster.online</span></div>
</div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : d; };
  const lang = (q.get("lang") || "de").toLowerCase() === "en" ? "en" : "de";
  const code = (q.get("code") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 20);
  const pos = ["bl", "br", "tl", "tr"].includes(q.get("pos")) ? q.get("pos") : "bl";
  const show = Math.max(10, num("show", 30)) * 1000;
  const pause = Math.max(0, num("pause", 180)) * 1000;
  document.documentElement.style.setProperty("--scale", Math.min(2, Math.max(0.5, num("scale", 1))));

  const ad = document.getElementById("ad"), box = document.getElementById("msgs"), timer = document.getElementById("timer");
  ad.className = pos;
  // ?preview=1: a stand-in game picture behind it, for looking at it in a
  // browser. In OBS the page stays transparent.
  if (q.get("preview")) document.body.style.background =
    "radial-gradient(ellipse at 30% 40%, #3b5a7a 0%, #1d2b3a 35%, #0d1218 70%), #0d1218";
  if (code) document.getElementById("url").textContent = "reset-booster.online/r/" + code;

  const T = {
    de: {
      free: ["Gratis für Windows 10/11", "Mehr FPS.", "Kein Placebo."],
      smooth: ["Premium · Neu", "Smooth Motion:", "Der 240-FPS-Look"],
      frame: ["Premium", "FrameBoost:", "Zwischenbilder live"],
      code: (c, p) => ["Mit meinem Code", c, p ? p + " % Rabatt" : "auf Premium"],
      safe: ["Echte Optimierung", "Kein Cheat.", "Kein Eingriff ins Spiel."]
    },
    en: {
      free: ["Free for Windows 10/11", "More FPS.", "No placebo."],
      smooth: ["Premium · New", "Smooth Motion:", "The 240 FPS look"],
      frame: ["Premium", "FrameBoost:", "Frames generated live"],
      code: (c, p) => ["With my code", c, p ? p + "% off" : "on Premium"],
      safe: ["Real optimization", "No cheat.", "Never touches the game."]
    }
  }[lang];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let discount = null;
  function messages() {
    const list = [T.free, T.smooth, T.frame, T.safe];
    if (code) list.splice(1, 0, T.code(code, discount), T.code(code, discount));   // the code twice per round
    return list;
  }
  function render(m, isCode) {
    const el = document.createElement("div");
    el.className = "msg";
    el.innerHTML = `<div class="eyebrow"><span class="dot"></span>${esc(m[0])}</div>` +
      (isCode
        ? `<div class="title"><span class="code"><span>${esc(m[1])}</span></span> <span class="red">${esc(m[2])}</span></div>`
        : `<div class="title">${esc(m[1])} <span class="red">${esc(m[2])}</span></div>`);
    return el;
  }

  // The streamer's discount, live from the same public lookup the website uses.
  // Offline or unknown code: the code is still shown, without a percentage.
  if (code) {
    fetch("https://sjwparnlbtuiyqmagyfg.supabase.co/rest/v1/rpc/affiliate_offer", {
      method: "POST",
      headers: { apikey: "sb_publishable_EP3WkfFmKLBznsC7kRncfA_bIrELJ8g", "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: code })
    }).then(r => r.ok ? r.json() : null).then(o => { if (o && o.discount_percent) discount = o.discount_percent; }).catch(() => {});
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function round() {
    const list = messages();
    const per = Math.max(4500, (show - 1200) / list.length);
    ad.classList.remove("hide"); void ad.offsetWidth; ad.classList.add("show");
    await wait(450);
    for (let i = 0; i < list.length; i++) {
      const isCode = !!code && (i === 1 || i === 2);
      const el = render(list[i], isCode);
      box.appendChild(el);
      void el.offsetWidth; el.classList.add("in");
      timer.style.animation = "none"; void timer.offsetWidth;
      timer.style.animation = `tick ${per}ms linear forwards`;
      await wait(per - 350);
      el.classList.remove("in"); el.classList.add("out");
      await wait(350);
      el.remove();
    }
    if (pause === 0) return round();
    ad.classList.add("hide");
    await wait(600);
    ad.classList.remove("show", "hide");
    await wait(pause);
    return round();
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => wait(300)).then(round);
})();
</script>
</body>
</html>
