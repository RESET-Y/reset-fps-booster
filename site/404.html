<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off track · RESET FPS BOOSTER</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Barlow:wght@400&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root { --bg: #050505; --text: #fff; --text-2: #a8a8a8; --text-3: #6a6a6a; --accent: #e8121f; --accent-bright: #ff3242; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 6px 1fr 6px; background: var(--bg); color: var(--text); font: 400 17px/1.6 "Barlow", "Segoe UI", system-ui, sans-serif; }
.stripe { background: repeating-linear-gradient(-56deg, var(--accent) 0 5px, #000 5px 10px); }
main { display: grid; place-items: center; padding: 40px 16px; text-align: center; }
.code { font: 900 italic clamp(120px, 30vw, 260px)/.85 "Saira Condensed", "Arial Narrow", sans-serif; color: var(--accent-bright); text-shadow: 0 0 60px rgba(232,18,31,.35); }
h1 { margin: 18px 0 0; font: 900 italic clamp(34px, 6vw, 56px)/1 "Saira Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
p { color: var(--text-2); margin: 14px auto 0; max-width: 44ch; }
.mono { font: 400 12px "JetBrains Mono", Consolas, monospace; letter-spacing: .14em; color: var(--text-3); text-transform: uppercase; margin-top: 28px; }
a.btn { display: inline-block; margin-top: 30px; padding: 14px 28px; background: var(--accent); color: #fff; text-decoration: none; transform: skewX(-12deg);
        font: 900 italic 17px "Saira Condensed", "Arial Narrow", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
a.btn span { display: inline-block; transform: skewX(12deg); }
a.btn:hover { background: var(--accent-bright); }
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <div>
    <div class="code">404</div>
    <h1>Off track</h1>
    <p>This page doesn't exist. Head back to the pits.</p>
    <a class="btn" href="/"><span>Back to start</span></a>
    <div class="mono">RESET FPS BOOSTER</div>
  </div>
</main>
<div class="stripe"></div>
</body>
</html>
