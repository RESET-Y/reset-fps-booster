<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danke · RESET FPS BOOSTER</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050505">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/legal.css">
<style>
.code-box { margin-top: 24px; padding: 22px 20px; border: 1px solid var(--accent); background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.code { font: 500 clamp(20px, 5.4vw, 30px) var(--mono); letter-spacing: .06em; color: var(--text); user-select: all; overflow-wrap: anywhere; }
.btn { display: inline-block; padding: 12px 22px; background: var(--accent); color: #fff; border: 0; cursor: pointer; transform: skewX(var(--skew)); text-decoration: none;
       font: 900 italic 16px var(--display); letter-spacing: .05em; text-transform: uppercase; }
.btn > span { display: inline-block; transform: skewX(12deg); }
.btn:hover { background: var(--accent-bright); }
ol { margin: 10px 0 0; padding-left: 22px; }
ol li + li { margin-top: 6px; }
.spin { display: inline-block; width: 14px; height: 14px; margin-right: 10px; vertical-align: -2px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <div class="wrap">
    <a href="/" aria-label="RESET FPS BOOSTER"><img src="assets/logo_wide.png" alt="RESET FPS BOOSTER" width="113" height="26"></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="false"><span>EN</span></button>
      <button type="button" data-lang="de" aria-pressed="true"><span>DE</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="eyebrow">Premium</div>
  <div id="out" aria-live="polite">
    <h1>Danke!</h1>
    <p>Diese Seite braucht JavaScript, um deinen Code anzuzeigen.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <a href="/" data-t="Back to start">Zur Startseite</a>
    <a href="impressum.html" data-t="Legal notice">Impressum</a>
    <a href="datenschutz.html" data-t="Privacy">Datenschutz</a>
    <a href="agb.html" data-t="Terms">AGB</a>
  </div>
</footer>
<div class="stripe"></div>
<script src="assets/legal.js"></script>
<script>
// Stripe sends the buyer here with ?session_id=cs_... ; the purchase-code
// function says what that checkout bought. The webhook usually lands within
// seconds, so "pending" is asked again for a while before giving up.
(function () {
  const API = "https://sjwparnlbtuiyqmagyfg.supabase.co/functions/v1/purchase-code";
  const MAIL = "lukas.reschke80@gmail.com";
  const session = new URLSearchParams(location.search).get("session_id") || "";
  const out = document.getElementById("out");
  let state = { kind: "loading" };

  const T = {
    de: {
      thanks: "Danke!",
      loading: "Einen Moment, dein Kauf wird bestätigt …",
      codeIntro: plan => `Dein Code für RESET FrameBoost ${plan === "monthly" ? "Monthly" : "Lifetime"}:`,
      copy: "Kopieren", copied: "Kopiert",
      keep: "Speicher dir den Code jetzt, zum Beispiel als Screenshot. Er gilt für genau einen Account.",
      howTitle: "So löst du ihn ein",
      how: ['Lade die App herunter und starte sie (<a href="/#download">Download</a>).', "Öffne die Seite <strong>Konto</strong> und melde dich an oder leg einen Account an.", "Gib den Code unter <strong>Du hast einen Code?</strong> ein und klick auf <strong>Einlösen</strong>. FrameBoost ist sofort freigeschaltet."],
      monthly: "Das Monats-Abo läuft, bis du es kündigst. Solange es läuft, bleibt der Code gültig.",
      account: "Premium ist auf deinem RESET-Account aktiv. Geh zurück in die App, die Freischaltung erscheint dort in wenigen Sekunden.",
      slow: `Dein Kauf ist noch nicht angekommen. Das dauert manchmal etwas länger. Lade die Seite in einer Minute neu. Kommt dann immer noch nichts, schreib mir an <a href="mailto:${MAIL}">${MAIL}</a> und leite die Stripe-Quittung weiter.`,
      nosession: `Auf dieser Seite erscheint nach einem Kauf dein Code. Es fehlt aber die Kaufnummer im Link. Wenn du gerade bezahlt hast, schreib mir an <a href="mailto:${MAIL}">${MAIL}</a> mit deiner Stripe-Quittung.`,
      error: `Die Abfrage hat nicht geklappt. Lade die Seite neu. Dein Kauf ist nicht verloren. Wenn es weiter hakt, schreib mir an <a href="mailto:${MAIL}">${MAIL}</a>.`,
      reload: "Neu laden"
    },
    en: {
      thanks: "Thank you!",
      loading: "One moment, confirming your purchase …",
      codeIntro: plan => `Your code for RESET FrameBoost ${plan === "monthly" ? "Monthly" : "Lifetime"}:`,
      copy: "Copy", copied: "Copied",
      keep: "Save the code now, for example as a screenshot. It works for exactly one account.",
      howTitle: "How to redeem it",
      how: ['Download and start the app (<a href="/#download">download</a>).', "Open the <strong>Account</strong> page and sign in or create an account.", "Enter the code under <strong>Have a code?</strong> and click <strong>Redeem</strong>. FrameBoost unlocks right away."],
      monthly: "The monthly plan runs until you cancel it. The code stays valid as long as it runs.",
      account: "Premium is active on your RESET account. Head back to the app, the unlock shows up there within seconds.",
      slow: `Your purchase hasn't arrived yet. Sometimes it takes a little longer. Reload this page in a minute. If there's still nothing, e-mail me at <a href="mailto:${MAIL}">${MAIL}</a> and forward your Stripe receipt.`,
      nosession: `After a purchase, your code shows up on this page, but this link is missing the purchase number. If you just paid, e-mail me at <a href="mailto:${MAIL}">${MAIL}</a> with your Stripe receipt.`,
      error: `The lookup failed. Reload the page. Your purchase is not lost. If it keeps failing, e-mail me at <a href="mailto:${MAIL}">${MAIL}</a>.`,
      reload: "Reload"
    }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function render() {
    const t = T[document.documentElement.lang === "en" ? "en" : "de"];
    let h = `<h1>${t.thanks}</h1>`;
    switch (state.kind) {
      case "loading": h += `<p><span class="spin" aria-hidden="true"></span>${t.loading}</p>`; break;
      case "code":
        h += `<p>${t.codeIntro(state.plan)}</p>
              <div class="code-box"><span class="code" id="code">${esc(state.code)}</span>
              <button class="btn" type="button" id="copy"><span>${state.copied ? t.copied : t.copy}</span></button></div>
              <p class="note">${t.keep}</p>
              <h2>${t.howTitle}</h2><ol>${t.how.map(x => `<li>${x}</li>`).join("")}</ol>
              ${state.plan === "monthly" ? `<p>${t.monthly}</p>` : ""}`;
        break;
      case "account": h += `<p>${t.account}</p>`; break;
      case "slow": h += `<p>${t.slow}</p><p style="margin-top:20px"><a class="btn" href="${esc(location.href)}"><span>${t.reload}</span></a></p>`; break;
      case "nosession": h += `<p>${t.nosession}</p>`; break;
      default: h += `<p>${t.error}</p>`;
    }
    out.innerHTML = h;
    const copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", () => {
      const done = () => { state.copied = true; render(); };
      if (navigator.clipboard) navigator.clipboard.writeText(state.code).then(done, () => {});
    });
  }
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });

  if (!/^cs_(live|test)_[A-Za-z0-9]{10,200}$/.test(session)) { state = { kind: "nosession" }; render(); return; }
  render();

  const started = Date.now();
  async function ask() {
    try {
      const r = await fetch(API + "?session_id=" + encodeURIComponent(session), { cache: "no-store" });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      if (d.status === "code") state = { kind: "code", plan: d.plan, code: d.code };
      else if (d.status === "account") state = { kind: "account", plan: d.plan };
      else if (Date.now() - started < 45000) { setTimeout(ask, 2000); return; }
      else state = { kind: "slow" };
    } catch {
      state = { kind: "error" };
    }
    render();
  }
  ask();
})();
</script>
</body>
</html>
