# Netlify: the website is the static folder site/, no build step.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The manager page is for Lukas only: keep it out of search engines.
[[headers]]
  for = "/manager/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
