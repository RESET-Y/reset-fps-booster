# Stripe calls the webhook without a Supabase token, so the platform JWT
# check must be off for it. The function verifies the Stripe-Signature header
# instead - see functions/stripe-webhook/index.ts.
[functions.stripe-webhook]
verify_jwt = false

# The thank-you page on the website has no Supabase session either. The long,
# random Stripe session id it sends is the key - see functions/purchase-code.
[functions.purchase-code]
verify_jwt = false

# Called by the app with a user token and by the hourly cron job with none.
# It only ever sets roles to what the database says, so it checks the token
# itself instead of requiring one - see functions/discord-sync/index.ts.
[functions.discord-sync]
verify_jwt = false

# Called by the daily cron job without a token. It only acts at 12:00 Berlin
# time and once per day; a manual test run needs the DIGEST_SECRET header.
# See functions/discord-digest/index.ts.
[functions.discord-digest]
verify_jwt = false

# Called by the database trigger on a new partner application, without a token.
# It mails the owner once per application. See functions/partner-application-notify/index.ts.
[functions.partner-application-notify]
verify_jwt = false
