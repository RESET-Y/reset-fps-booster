# Stripe calls the webhook without a Supabase token, so the platform JWT
# check must be off for it. The function verifies the Stripe-Signature header
# instead - see functions/stripe-webhook/index.ts.
[functions.stripe-webhook]
verify_jwt = false

# Called by the app with a user token and by the hourly cron job with none.
# It only ever sets roles to what the database says, so it checks the token
# itself instead of requiring one - see functions/discord-sync/index.ts.
[functions.discord-sync]
verify_jwt = false
