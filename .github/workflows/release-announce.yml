name: Announce a new release on Discord

# When a release is published on GitHub, post it to #ankündigungen through a
# Discord webhook. The webhook URL is the secret DISCORD_ANNOUNCE_WEBHOOK
# (repo Settings > Secrets and variables > Actions). No bot token is needed.
#
# Test run without publishing anything new: Actions > this workflow > Run
# workflow, enter a tag such as v1.4.2-beta. It posts that release again.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce, e.g. v1.4.2-beta"
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Read the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_RELEASE: ${{ toJSON(github.event.release) }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "$TAG_INPUT" ]; then
            gh api "repos/$REPO/releases/tags/$TAG_INPUT" > release.json
          else
            printf '%s' "$EVENT_RELEASE" > release.json
          fi
          jq -e '.tag_name' release.json > /dev/null

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          set -eu
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Secret DISCORD_ANNOUNCE_WEBHOOK is not set."
            exit 1
          fi
          # The first .exe is the app itself; the release page is the fallback.
          payload=$(jq '
            {
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: ("🚀 RESET FPS Booster " + .tag_name),
                  url: .html_url,
                  description: ((.body // "") | if length > 3500 then .[0:3500] + "…" else . end
                                | if . == "" then "Neues Update ist da." else . end),
                  color: 3447003,
                  fields: [{
                    name: "Download",
                    value: (([.assets[]? | select(.name | endswith(".exe"))][0].browser_download_url) // .html_url)
                  }],
                  footer: { text: "Versionsnotizen auf GitHub" }
                }]
              }' release.json)
          printf '%s' "$payload" | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK" > /dev/null
          echo "Announced $(jq -r .tag_name release.json)."
